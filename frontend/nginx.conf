# The client and the API on one origin, as with the Vite proxy in development, so the session
# cookie stays first-party (ADR 0004).
server {
    listen 80;
    root /usr/share/nginx/html;

    # Uploads are at most 10 MB (NFR-09); the API checks the exact limit.
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        proxy_pass http://api:8000/;   # the trailing slash removes the /api prefix
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Client-side routes such as /applications/<id> are served by index.html.
    location / {
        try_files $uri /index.html;
    }
}

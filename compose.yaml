# Values come from the repository-root .env file (copy .env.example).
#   docker compose up -d                    only the database, for development (README)
#   docker compose --profile app up --build the whole system on http://localhost:8080
services:
  db:
    # PostgreSQL with the pgvector extension (used later for RAG retrieval).
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Bound to localhost only: the database is not exposed to the network.
      # Host port 5433 by default, so it does not clash with a locally installed PostgreSQL.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Inside the compose network the database is `db` on its own port, not localhost:5433.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DOCUMENT_MASTER_KEY: ${DOCUMENT_MASTER_KEY:?set DOCUMENT_MASTER_KEY in .env}
      DOCUMENT_KEY_ID: ${DOCUMENT_KEY_ID:-k1}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOAD_DEMO: ${LOAD_DEMO:-true}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      # Field extraction (ADR 0007); without a key the "Read from document" button is hidden.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EXTRACTION_MODEL: ${EXTRACTION_MODEL:-gpt-5.4-mini}
      MODEL_MONTHLY_BUDGET_USD: ${MODEL_MONTHLY_BUDGET_USD:-20}
    volumes:
      - documents:/app/storage
    # No published port: only the web container talks to the API.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 60s

  web:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
  documents:   # encrypted uploaded documents of the api container

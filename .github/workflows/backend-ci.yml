name: Backend CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Lint and test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: visaassist
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: visaassist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visaassist -d visaassist"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://visaassist:ci-only-password@localhost:5432/visaassist
      RUN_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies (fails if uv.lock is out of date)
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Check formatting (ruff)
        run: uv run ruff format --check .

      - name: Run tests (pytest, including database integration tests)
        run: uv run pytest
